<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Satmola Logistics - Party Lookup & Dispatch</title>
  
  <!-- High Quality Satmola App Icon (Mobile Home Screen Shortcut) -->
  <meta name="theme-color" content="#d91f2f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Satmola Dispatch">

  <link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAZMAAADHCAYAAADcdL40AAAQAElEQVR4Aex9BYAkx3X296q7B3aW9/hOJ2ayGCwysy1jYgec/Ik5sWOKYyeOk9hxHDPIMjsxoyxbMouZ8SQdMy/j[...]
  <link rel="apple-touch-icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAZMAAADHCAYAAADcdL40AAAQAElEQVR4Aex9BYAkx3X296q7B3aW9/hOJ2ayGCwysy1jYgec/Ik5sWOKYyeOk9hxHDPIMjsxoyxbMouZ8SQdMy/jUHdX/[...] 

  <!-- Font Awesome Icons & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --rd: #d91f2f;
      --rd-dark: #b8101f;
      --gd: #f5a30a;
      --bg: #fdfaf7;
      --cd: #ffffff;
      --tx: #2a1a1a;
      --mu: #7a6a60;
      --ln: #ece3cc;
      --gr: #0a8f63;
      --bl: #2563eb;
      --shadow-soft: 0 10px 25px -4px rgba(217, 31, 47, 0.07), 0 4px 10px -2px rgba(0, 0, 0, 0.04);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--tx);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      padding: 14px;
      max-width: 500px;
      margin-inline: auto;
      line-height: 1.45;
    }
    .hd {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--ln);
    }
    .logo-img {
      height: 44px;
      width: auto;
      object-fit: contain;
      flex-shrink: 0;
    }
    h1 { font-size: 16px; margin: 0; color: var(--rd); line-height: 1.2; font-weight: 800; }
    h1 small { display: block; font-size: 11px; color: var(--mu); font-weight: 600; margin-top: 2px; }

    .card {
      background: var(--cd);
      border: 1px solid var(--ln);
      border-radius: 16px;
      padding: 16px;
      box-shadow: var(--shadow-soft);
      margin-bottom: 14px;
    }
    input[type=search] {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--ln);
      border-radius: 12px;
      font-size: 14px;
      outline: none;
      background: #fff;
      font-family: inherit;
      color: var(--tx);
    }
    input[type=search]:focus { border-color: var(--rd); }

    .res {
      max-height: 250px;
      overflow-y: auto;
      margin-top: 8px;
    }
    .res-item {
      padding: 10px 8px;
      border-bottom: 1px solid var(--ln);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.15s;
    }
    .res-item:hover, .res-item:active { background: #fff5ea; }
    .res-item b { font-size: 13px; color: var(--tx); display: block; }
    .res-item small { font-size: 11px; color: var(--mu); }

    .details-card {
      display: none;
      background: #fff;
      border: 1.5px solid #f6dd8f;
      border-radius: 16px;
      padding: 16px;
      margin-top: 12px;
      animation: fadeIn 0.25s ease forwards;
    }
    .party-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--rd);
      margin-bottom: 10px;
      line-height: 1.3;
    }
    
    .store-photo-card {
      margin: 10px 0 14px 0;
      border-radius: 12px;
      overflow: hidden;
      border: 1.5px solid #e2e8f0;
      background: #0f172a;
      display: none;
      position: relative;
    }
    .store-photo-card img {
      width: 100%;
      height: 190px;
      object-fit: cover;
      display: block;
    }
    .store-photo-badge {
      position: absolute;
      bottom: 8px;
      left: 8px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .info-row {
      display: flex;
      font-size: 13px;
      margin-bottom: 6px;
      line-height: 1.4;
    }
    .info-lbl {
      width: 115px;
      color: var(--mu);
      font-weight: 600;
      flex-shrink: 0;
    }
    .info-val {
      color: var(--tx);
      font-weight: 500;
      word-break: break-word;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 99px;
      font-weight: 700;
      margin-top: 2px;
    }
    .tag.gps { background: #e8fbf1; border: 1px solid #8fe0b8; color: #0a7a4d; }
    .tag.approx { background: #fdf3d8; border: 1px solid #f6dd8f; color: #8a6500; }

    .actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 9px;
      margin-top: 16px;
    }
    button {
      border: 0;
      border-radius: 12px;
      padding: 13px 8px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-family: inherit;
      touch-action: manipulation;
      transition: all 0.2s;
    }
    .btn-wa {
      background: #25d366;
      color: #fff;
      font-size: 14.5px;
      box-shadow: 0 4px 12px rgba(37,211,102,0.3);
    }
    .btn-porter {
      background: linear-gradient(135deg, #1062eb, #094bb9);
      color: #fff;
      font-size: 14.5px;
      box-shadow: 0 4px 12px rgba(16, 98, 235, 0.35);
    }
    .btn-map { background: var(--bl); color: #fff; }
    .btn-call-rep {
      background: #fff8eb;
      color: #b45309;
      border: 1.5px solid #f6dd8f;
      font-size: 13.5px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      background: rgba(25, 25, 25, 0.95);
      backdrop-filter: blur(4px);
      color: #fff;
      padding: 11px 20px;
      border-radius: 99px;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      max-width: 90%;
      box-shadow: 0 6px 20px rgba(0,0,0,0.25);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 999;
    }
    .toast.on {
      opacity: 1;
      transform: translateX(-50%) translateY(-5px);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header class="hd">
    <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAZMAAADHCAYAAADcdL40AAAQAElEQVR4Aex9BYAkx3X296q7B3aW9/hOJ2ayGCwysy1jYgec/Ik5sWOKYyeOk9hxHDPIMjsxoyxbMouZ8SQdMy/jUHdX/d+r2dmd3ds73Z1OsmJtX39T[...]
    <h1>Party Lookup &amp; Share<small>Instant Directory &amp; Contact Forward</small></h1>
  </header>

  <main class="card">
    <input type="search" id="q" placeholder="Type Party / BP Name, City, or Block...">
    <div class="res" id="res"></div>

    <div class="details-card" id="detCard">
      <div class="party-title" id="dName"></div>

      <div class="store-photo-card" id="dPhotoCard">
        <img id="dPhotoImg" alt="Storefront Photo">
        <div class="store-photo-badge">
          <i class="fa-solid fa-camera"></i> Verified Storefront Photo
        </div>
      </div>

      <div class="info-row"><span class="info-lbl">Group:</span><span class="info-val" id="dGroup"></span></div>
      <div class="info-row"><span class="info-lbl">Sales Rep:</span><span class="info-val" id="dRep"></span></div>
      <div class="info-row"><span class="info-lbl">Area / City:</span><span class="info-val" id="dCity"></span></div>
      <div class="info-row"><span class="info-lbl">Bill-to Block:</span><span class="info-val" id="dBlock"></span></div>
      <div class="info-row"><span class="info-lbl">Location Status:</span><span class="info-val" id="dLocTag"></span></div>

      <div class="actions">
        <button class="btn-porter" id="btnPorter">
          <i class="fa-solid fa-truck-fast"></i> Book Porter (Exact Pin)
        </button>
        <button class="btn-wa" id="btnWa">
          <i class="fa-brands fa-whatsapp"></i> Share Details on WhatsApp
        </button>
        <button class="btn-call-rep" id="btnCallRep">
          <i class="fa-solid fa-phone"></i> Call Sales Executive (<span id="repNameShort">Rep</span>)
        </button>
        <button class="btn-map" id="btnMap">
          <i class="fa-solid fa-map-location-dot"></i> Open Google Map
        </button>
      </div>
    </div>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    var REP_PHONES = {
      "Amrendra Kumar": "9971719926",
      "Rashid":         "8010157985",
      "Kundan":         "9717530365",
      "Tarun Kumar":    "9560522617",
      "Shamim":         "9971525162",
      "Vivek Mittal":   "9818211715",
      "Amit Mishra":    "",
      "Pushkar S.":     "",
      "Suman P.":       "",
      "Dileep Nigam":   ""
    };

    var SCRIPT_URL = "https://script.google.com/macros/s/AKfycby892XHKcxOTcxuOglpDpI9yp0SFTM8-pWr1rhbhux4nPvcfMu6tgYfjGyeXs8_197T/exec";
    var BPS = [];
    function S(v){return String(v==null?"":v).trim()}
    var curBp = null;
    var $ = function(id) { return document.getElementById(id); };

    function toast(m, duration) {
      var t = $("toast"); 
      t.textContent = m; 
      t.className = "toast on";
      setTimeout(function(){ t.className = "toast"; }, duration || 2400);
    }

    function getDirectPhotoUrl(link) {
      if (!link) return "";
      var m = link.match(/id=([a-zA-Z0-9_-]+)/) || link.match(/\/d\/([a-zA-Z0-9_-]+)/);
      if (m && m[1]) {
        return "https://drive.google.com/thumbnail?id=" + m[1] + "&sz=w800";
      }
      return link;
    }

    function parseCoordsFromUrl(url) {
      if (!url) return null;
      var m = url.match(/q=(-?\d+\.\d+),(-?\d+\.\d+)/) ||
              url.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/) ||
              url.match(/(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)/);
      return m ? [parseFloat(m[1]), parseFloat(m[2])] : null;
    }

    function fetchLiveBps() {
      toast("Syncing live BP Master...", 2000);
      fetch(SCRIPT_URL)
        .then(function(res) { return res.json(); })
        .then(function(data) {
          if (!Array.isArray(data) || data.length === 0) { toast("Sheet sync failed: " + (data && data.error ? data.error : "no data")); return; }
          BPS = data.map(function(r) {
            var lat = "", lng = "";
            var sets = [["Final Lat","Final Lng"],["Driver Lat","Driver Lng"],["Sales Lat","Sales Lng"],["Latitude","Longitude"],["Lat","Lng"]];
            for (var i = 0; i < sets.length; i++) {
              var a = parseFloat(r[sets[i][0]]), b = parseFloat(r[sets[i][1]]);
              if (isFinite(a) && isFinite(b) && a > 6 && a < 38 && b > 67 && b < 98) { lat = a.toFixed(6); lng = b.toFixed(6); break; }
            }
            var link = S(r["Final Map Link"] || r["Driver Map Link"] || r["Sales Map Link"] || r["Map Hyperlink"]);
            if (!lat || !lng) {
              var links = [r["Final Map Link"], r["Driver Map Link"], r["Sales Map Link"], r["Map Hyperlink"]];
              for (var j = 0; j < links.length; j++) {
                var p = parseCoordsFromUrl(S(links[j]));
                if (p && p[0] > 6 && p[0] < 38 && p[1] > 67 && p[1] < 98) { lat = p[0].toFixed(6); lng = p[1].toFixed(6); break; }
              }
            }
            var photo = S(r["Photo Link"] || r["Sales Photo Link"] || r["Driver Photo Link"] || r["photo link (Sales Team)"]);
            var hasPin = !!(lat && lng);

            return [
              r["BP Name"] || "",
              r["City Name"] || r["Ship-to City"] || "",
              r["Bill-to Block"] || "",
              r["Sales Employee"] || "",
              r["GRoup"] || "",
              r["State"] || "",
              lat,
              lng,
              link,
              photo,
              hasPin ? S(r["Location Confidence"]) : "",
              hasPin ? S(r["Location Status"]) : ""
            ];
          }).filter(function(b) { return b[0]; });
          toast("● " + BPS.length + " Parties Loaded Live", 2200);
        }).catch(function(err) {
          console.error("Live fetch error:", err); toast("Sheet sync error - check internet / script URL");
        });
    }
    window.addEventListener("DOMContentLoaded", fetchLiveBps);

    function getMapUrl(bp) {
      if (!bp) return "";
      if (bp.hasGps) {
        return "https://www.google.com/maps?q=" + bp.lat + "," + bp.lng;
      }
      if (bp.mapLink && bp.mapLink.indexOf("http") > -1) {
        return bp.mapLink;
      }
      return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(bp.name + " " + bp.block + " " + bp.city);
    }

    $("q").oninput = function() {
      var q = this.value.trim().toLowerCase();
      var res = $("res");
      if (!q) { res.innerHTML = ""; return; }

      var matches = [];
      for (var i = 0; i < BPS.length; i++) {
        var b = BPS[i];
        var text = (b[0] + " " + b[1] + " " + b[2] + " " + b[3] + " " + b[4]).toLowerCase();
        if (text.indexOf(q) > -1) matches.push({ idx: i, data: b });
        if (matches.length >= 8) break;
      }

      res.innerHTML = matches.map(function(m) {
        return "<div class='res-item' data-idx='" + m.idx + "'>" +
               "<div><b>" + m.data[0] + "</b><small>" + m.data[1] + " · " + m.data[2] + "</small></div>" +
               "<span style='color:var(--rd);font-weight:700;'>Select ➔</span>" +
               "</div>";
      }).join("") || "<div style='padding:10px;color:var(--mu);font-size:12px;'>No matching parties found</div>";
    };

    $("res").onclick = function(e) {
      var item = e.target.closest("[data-idx]");
      if (!item) return;
      var b = BPS[+item.dataset.idx];
      var rep = b[3] || "N/A";
      var repPhone = REP_PHONES[rep] || "";
      var hasGps = !!(b[6] && b[7]);
      var photoUrl = b[9] ? getDirectPhotoUrl(b[9]) : "";

      curBp = {
        name: b[0],
        city: b[1],
        block: b[2],
        rep: rep,
        group: b[4] || "N/A",
        repPhone: repPhone,
        lat: b[6],
        lng: b[7],
        mapLink: b[8] || "",
        hasGps: hasGps,
        photoUrl: photoUrl,
        conf: b[10] || "",
        ls: b[11] || ""
      };

      $("q").value = curBp.name;
      $("res").innerHTML = "";

      $("dName").textContent = curBp.name;
      $("dGroup").textContent = curBp.group;
      $("dRep").textContent = curBp.rep;
      $("dCity").textContent = curBp.city;
      $("dBlock").textContent = curBp.block;
      $("repNameShort").textContent = curBp.rep;
      
      if (curBp.photoUrl) {
        $("dPhotoImg").src = curBp.photoUrl;
        $("dPhotoCard").style.display = "block";
      } else {
        $("dPhotoCard").style.display = "none";
      }

      if (curBp.hasGps) {
        var coords = " (" + curBp.lat + ", " + curBp.lng + ")";
        var why = curBp.ls ? " - " + curBp.ls : "";
        if (curBp.conf === "High") {
          $("dLocTag").innerHTML = "<span class='tag gps'><i class='fa-solid fa-circle-check'></i> Verified Pin" + why + coords + "</span>";
        } else if (curBp.conf === "Low") {
          $("dLocTag").innerHTML = "<span class='tag approx'><i class='fa-solid fa-triangle-exclamation'></i> Pin check karo" + why + coords + "</span>";
        } else {
          $("dLocTag").innerHTML = "<span class='tag approx'><i class='fa-solid fa-circle-dot'></i> Pin (ek source)" + why + coords + "</span>";
        }
      } else {
        $("dLocTag").innerHTML = "<span class='tag approx'><i class='fa-solid fa-circle-dot'></i> Approximate Area Pin</span>";
      }

      $("detCard").style.display = "block";
    };

    $("btnPorter").onclick = function() {
      if (!curBp) return toast("Please select a Business Partner first!");

      toast("Opening Porter...", 1500);

      var dropQuery = curBp.hasGps 
        ? (curBp.lat + "," + curBp.lng) 
        : encodeURIComponent(curBp.name + ", " + curBp.block + ", " + curBp.city);

      var isAndroid = /android/i.test(navigator.userAgent);
      var porterWeb = "https://porter.in/book?drop=" + dropQuery;
      var porterAppUrl = "intent://porter.in/book?drop=" + dropQuery + "#Intent;scheme=https;package=com.theporter.android.customerapp;end";

      if (isAndroid) {
        window.location.href = porterAppUrl;
        setTimeout(function() {
          window.location.href = porterWeb;
        }, 1200);
      } else {
        window.location.href = "porter://book?drop=" + dropQuery;
        setTimeout(function() {
          window.location.href = porterWeb;
        }, 1200);
      }
    };

    $("btnWa").onclick = function() {
      if (!curBp) return;
      var mapLink = getMapUrl(curBp);
      var repDetails = curBp.rep + (curBp.repPhone ? " (" + curBp.repPhone + ")" : "");

      var text = "👨‍💻 *SATMOLA PARTY DETAILS*\n" +
                 "━━━━━━━━━━━━━━━━━━\n" +
                 "🏬 *Party:* " + curBp.name + "\n" +
                 "🏷️ *Group:* " + curBp.group + "\n" +
                 "👤 *Rep:* " + repDetails + "\n" +
                 "📍 *Address:* " + curBp.block + ", " + curBp.city + "\n" +
                 "🗺️ *Location Pin:* " + mapLink;

      window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank");
    };

    $("btnCallRep").onclick = function() {
      if (!curBp) return;
      if (!curBp.repPhone) {
        return toast("Contact number for " + curBp.rep + " is not configured.");
      }
      window.location.href = "tel:" + curBp.repPhone.trim();
    };

    $("btnMap").onclick = function() {
      if (!curBp) return;
      var mapLink = getMapUrl(curBp);
      window.open(mapLink, "_blank");
    };
  </script>
</body>
</html>
