<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Satmola BP Quick Directory & Porter Dispatch</title>
  
  <!-- Font Awesome Icons & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --rd: #d91f2f;
      --gd: #f5a30a;
      --bg: #fdfaf7;
      --cd: #ffffff;
      --tx: #2a1a1a;
      --mu: #7a6a60;
      --ln: #ece3cc;
      --gr: #0a8f63;
      --bl: #2563eb;
      --porter: #1062eb;
      --porter-dark: #094bb9;
      --shadow-soft: 0 10px 25px -4px rgba(217, 31, 47, 0.07), 0 4px 10px -2px rgba(0, 0, 0, 0.04);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--tx);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      padding: 14px;
      max-width: 500px;
      margin-inline: auto;
      line-height: 1.45;
    }
    .hd {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--ln);
    }
    .logo {
      background: linear-gradient(145deg, #e8283a, #b8101f);
      border: 2px solid var(--gd);
      border-radius: 12px;
      color: #fff;
      padding: 6px 12px;
      font-weight: 900;
      letter-spacing: 1.5px;
      text-align: center;
      font-size: 13px;
      box-shadow: 0 4px 12px rgba(184, 16, 31, 0.25);
      flex-shrink: 0;
    }
    .logo small { display: block; font-size: 8px; color: #ffe6a0; letter-spacing: 2px; }
    h1 { font-size: 16px; margin: 0; color: var(--rd); line-height: 1.2; font-weight: 800; }
    h1 small { display: block; font-size: 11px; color: var(--mu); font-weight: 600; margin-top: 2px; }

    .card {
      background: var(--cd);
      border: 1px solid var(--ln);
      border-radius: 16px;
      padding: 16px;
      box-shadow: var(--shadow-soft);
      margin-bottom: 14px;
    }
    input[type=search] {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--ln);
      border-radius: 12px;
      font-size: 14px;
      outline: none;
      background: #fff;
      font-family: inherit;
      color: var(--tx);
    }
    input[type=search]:focus { border-color: var(--rd); }

    .res {
      max-height: 250px;
      overflow-y: auto;
      margin-top: 8px;
    }
    .res-item {
      padding: 10px 8px;
      border-bottom: 1px solid var(--ln);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.15s;
    }
    .res-item:hover, .res-item:active { background: #fff5ea; }
    .res-item b { font-size: 13px; color: var(--tx); display: block; }
    .res-item small { font-size: 11px; color: var(--mu); }

    .details-card {
      display: none;
      background: #fff;
      border: 1.5px solid #f6dd8f;
      border-radius: 16px;
      padding: 16px;
      margin-top: 12px;
      animation: fadeIn 0.25s ease forwards;
    }
    .party-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--rd);
      margin-bottom: 10px;
      line-height: 1.3;
    }
    .info-row {
      display: flex;
      font-size: 13px;
      margin-bottom: 6px;
      line-height: 1.4;
    }
    .info-lbl {
      width: 115px;
      color: var(--mu);
      font-weight: 600;
      flex-shrink: 0;
    }
    .info-val {
      color: var(--tx);
      font-weight: 500;
      word-break: break-word;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 99px;
      font-weight: 700;
      margin-top: 2px;
    }
    .tag.gps { background: #e8fbf1; border: 1px solid #8fe0b8; color: #0a7a4d; }
    .tag.approx { background: #fdf3d8; border: 1px solid #f6dd8f; color: #8a6500; }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-top: 16px;
    }
    button {
      border: 0;
      border-radius: 12px;
      padding: 13px 8px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-family: inherit;
      touch-action: manipulation;
      transition: all 0.2s;
    }
    .btn-wa {
      grid-column: span 2;
      background: #25d366;
      color: #fff;
      font-size: 14.5px;
      box-shadow: 0 4px 12px rgba(37,211,102,0.3);
    }
    .btn-porter {
      grid-column: span 2;
      background: linear-gradient(135deg, #1062eb, #094bb9);
      color: #fff;
      font-size: 14.5px;
      box-shadow: 0 4px 12px rgba(16, 98, 235, 0.35);
    }
    .btn-map { background: var(--bl); color: #fff; }
    .btn-call-party { background: #f0f3f6; color: var(--tx); border: 1px solid #ccd; }
    .btn-call-rep {
      grid-column: span 2;
      background: #fff8eb;
      color: #b45309;
      border: 1.5px solid #f6dd8f;
      font-size: 13.5px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      background: rgba(25, 25, 25, 0.95);
      backdrop-filter: blur(4px);
      color: #fff;
      padding: 11px 20px;
      border-radius: 99px;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      max-width: 90%;
      box-shadow: 0 6px 20px rgba(0,0,0,0.25);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 999;
    }
    .toast.on {
      opacity: 1;
      transform: translateX(-50%) translateY(-5px);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header class="hd">
    <div class="logo">SATMOLA<small>LOGISTICS</small></div>
    <h1>Party Lookup &amp; Share<small>Instant Directory &amp; Contact Forward</small></h1>
  </header>

  <main class="card">
    <input type="search" id="q" placeholder="Type Party / BP Name, City, or Block...">
    <div class="res" id="res"></div>

    <div class="details-card" id="detCard">
      <div class="party-title" id="dName"></div>
      <div class="info-row"><span class="info-lbl">Sales Rep:</span><span class="info-val" id="dRep"></span></div>
      <div class="info-row"><span class="info-lbl">Area / City:</span><span class="info-val" id="dCity"></span></div>
      <div class="info-row"><span class="info-lbl">Bill-to Block:</span><span class="info-val" id="dBlock"></span></div>
      <div class="info-row"><span class="info-lbl">Party Mobile:</span><span class="info-val" id="dMob"></span></div>
      <div class="info-row"><span class="info-lbl">Location Status:</span><span class="info-val" id="dLocTag"></span></div>

      <div class="actions">
        <!-- Direct Instant Porter Launch Button -->
        <button class="btn-porter" id="btnPorter">
          <i class="fa-solid fa-truck-fast"></i> Book Porter (Exact Pin)
        </button>
        <button class="btn-wa" id="btnWa">
          <i class="fa-brands fa-whatsapp"></i> Share Details on WhatsApp
        </button>
        <button class="btn-call-rep" id="btnCallRep">
          <i class="fa-solid fa-phone"></i> Call Sales Executive (<span id="repNameShort">Rep</span>)
        </button>
        <button class="btn-map" id="btnMap">
          <i class="fa-solid fa-map-location-dot"></i> Open Google Map
        </button>
        <button class="btn-call-party" id="btnCallParty">
          <i class="fa-solid fa-phone-volume"></i> Call Party
        </button>
      </div>
    </div>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    // Sales Executive Contact Directory
    var REP_PHONES = {
      "SUMAN P.":       "9899996180",
      "Amit Mishra":    "9310775300",
      "PUSHKAR S.":     "8475058000",
      "TARUN KUMAR":    "9971719926",
      "AMRENDRA KUMAR": "9717444940",
      "RASHID":         "",
      "KUNDAN":         "",
      "Dileep Nigam":   "8010969742",
      "SHAMIM":         "",
      "VIVEK MITTAL":   ""
    };

    var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyakTMK67GeFaS8m6NaPHSCLmdMUtqwOlVS2WyA7ZbShi5M7Naa4bv_iirrZJTEzgurvA/exec";
    var BPS = [];
    function S(v){return String(v==null?"":v).trim()}
    var curBp = null;
    var $ = function(id) { return document.getElementById(id); };

    function toast(m, duration) {
      var t = $("toast"); 
      t.textContent = m; 
      t.className = "toast on";
      setTimeout(function(){ t.className = "toast"; }, duration || 2400);
    }

    // Helper to parse coordinate links
    function parseCoordsFromUrl(url) {
      if (!url) return null;
      var m = url.match(/q=(-?\d+\.\d+),(-?\d+\.\d+)/) ||
              url.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/) ||
              url.match(/(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)/);
      return m ? [parseFloat(m[1]), parseFloat(m[2])] : null;
    }

    // Live Sync from Master Sheet
    function fetchLiveBps() {
      toast("Syncing live BP Master...", 2000);
      fetch(SCRIPT_URL)
        .then(function(res) { return res.json(); })
        .then(function(data) {
          if (!Array.isArray(data) || data.length === 0) { toast("Sheet sync failed: " + (data && data.error ? data.error : "no data")); return; }
          BPS = data.map(function(r) {
            var lat = S(r["Latitude"] || r["Lat"]);
            var lng = S(r["Longitude"] || r["Lng"]);
            var link = S(r["Map Hyperlink"]);
            
            // Extract coordinates from link if raw lat/lng missing
            if ((!lat || !lng) && link) {
              var p = parseCoordsFromUrl(link);
              if (p) {
                lat = p[0].toFixed(6);
                lng = p[1].toFixed(6);
              }
            }

            return [
              r["BP Name"] || "",
              r["City Name"] || r["Ship-to City"] || "",
              r["Bill-to Block"] || "",
              r["Sales Employee"] || "",
              r["GRoup"] || "",
              r["State"] || "",
              r["Mobile"] || "",
              lat,
              lng,
              link
            ];
          }).filter(function(b) { return b[0]; });
          toast("● " + BPS.length + " Parties Loaded Live!", 2200);
        })
        .catch(function(err) {
          console.error("Live fetch error:", err); toast("Sheet sync error - check internet / script URL");
        });
    }
    window.addEventListener("DOMContentLoaded", fetchLiveBps);

    // Reliable Google Maps Link Resolution
    function getMapUrl(bp) {
      if (!bp) return "";
      if (bp.mapLink && bp.mapLink.indexOf("http") > -1) {
        return bp.mapLink;
      }
      if (bp.hasGps) {
        return "https://www.google.com/maps?q=" + bp.lat + "," + bp.lng;
      }
      return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(bp.name + " " + bp.block + " " + bp.city);
    }

    // Search Query Matching
    $("q").oninput = function() {
      var q = this.value.trim().toLowerCase();
      var res = $("res");
      if (!q) { res.innerHTML = ""; return; }

      var matches = [];
      for (var i = 0; i < BPS.length; i++) {
        var b = BPS[i];
        var text = (b[0] + " " + b[1] + " " + b[2] + " " + b[3]).toLowerCase();
        if (text.indexOf(q) > -1) matches.push({ idx: i, data: b });
        if (matches.length >= 8) break;
      }

      res.innerHTML = matches.map(function(m) {
        return "<div class='res-item' data-idx='" + m.idx + "'>" +
               "<div><b>" + m.data[0] + "</b><small>" + m.data[1] + " · " + m.data[2] + "</small></div>" +
               "<span style='color:var(--rd);font-weight:700;'>Select ➔</span>" +
               "</div>";
      }).join("") || "<div style='padding:10px;color:var(--mu);font-size:12px;'>No matching parties found</div>";
    };

    // Render Selected BP Details
    $("res").onclick = function(e) {
      var item = e.target.closest("[data-idx]");
      if (!item) return;
      var b = BPS[+item.dataset.idx];
      var rep = b[3] || "N/A";
      var repPhone = REP_PHONES[rep] || "";
      var hasGps = !!(b[7] && b[8]);

      curBp = {
        name: b[0],
        city: b[1],
        block: b[2],
        rep: rep,
        repPhone: repPhone,
        mob: b[6] || "",
        lat: b[7],
        lng: b[8],
        mapLink: b[9] || "",
        hasGps: hasGps
      };

      $("q").value = curBp.name;
      $("res").innerHTML = "";

      $("dName").textContent = curBp.name;
      $("dRep").textContent = curBp.rep + (curBp.repPhone ? " (📞 " + curBp.repPhone + ")" : "");
      $("dCity").textContent = curBp.city;
      $("dBlock").textContent = curBp.block;
      $("dMob").textContent = curBp.mob ? curBp.mob : "Not Available";
      $("repNameShort").textContent = curBp.rep;
      
      if (curBp.hasGps) {
        $("dLocTag").innerHTML = "<span class='tag gps'><i class='fa-solid fa-circle-check'></i> Verified Live GPS Pin</span>";
      } else {
        $("dLocTag").innerHTML = "<span class='tag approx'><i class='fa-solid fa-circle-dot'></i> Approximate Area</span>";
      }

      $("detCard").style.display = "block";
    };

    // 1-Click Instant Porter Launch with Exact Drop Coordinates
    $("btnPorter").onclick = function() {
      if (!curBp) return toast("Please select a Business Partner first!");

      toast("Opening Porter...", 1500);

      var dropQuery = curBp.hasGps 
        ? (curBp.lat + "," + curBp.lng) 
        : encodeURIComponent(curBp.name + ", " + curBp.block + ", " + curBp.city);

      var isAndroid = /android/i.test(navigator.userAgent);
      var porterWeb = "https://porter.in/book?drop=" + dropQuery;
      var porterAppUrl = "intent://porter.in/book?drop=" + dropQuery + "#Intent;scheme=https;package=com.theporter.android.customerapp;end";

      if (isAndroid) {
        window.location.href = porterAppUrl;
        setTimeout(function() {
          window.location.href = porterWeb;
        }, 1200);
      } else {
        window.location.href = "porter://book?drop=" + dropQuery;
        setTimeout(function() {
          window.location.href = porterWeb;
        }, 1200);
      }
    };

    // Share Details on WhatsApp
    $("btnWa").onclick = function() {
      if (!curBp) return;
      var mapLink = getMapUrl(curBp);

      var text = "🚚 *SATMOLA PARTY DETAILS*\n" +
                 "━━━━━━━━━━━━━━━━━━\n" +
                 "🏬 *Party:* " + curBp.name + "\n" +
                 "👤 *Rep:* " + curBp.rep + (curBp.repPhone ? " (" + curBp.repPhone + ")" : "") + "\n" +
                 "📍 *Address:* " + curBp.block + ", " + curBp.city + "\n" +
                 (curBp.mob ? "📞 *Party Mobile:* " + curBp.mob + "\n" : "") +
                 "🗺️ *Location:* " + mapLink;

      window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank");
    };

    // Call Sales Representative
    $("btnCallRep").onclick = function() {
      if (!curBp) return;
      if (!curBp.repPhone) {
        return toast("Contact number for " + curBp.rep + " is not configured.");
      }
      window.location.href = "tel:" + curBp.repPhone.trim();
    };

    // Open Google Map Pin
    $("btnMap").onclick = function() {
      if (!curBp) return;
      var mapLink = getMapUrl(curBp);
      window.open(mapLink, "_blank");
    };

    // Call Party Mobile
    $("btnCallParty").onclick = function() {
      if (!curBp || !curBp.mob) return toast("Party mobile number not available");
      window.location.href = "tel:" + curBp.mob.split(",")[0].trim();
    };
  </script>
</body>
</html>
