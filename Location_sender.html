  <style>
    :root {
      --rd: #d91f2f;
      --rd-dark: #b8101f;
      --gd: #f5a30a;
      --bg: #fdfaf7;
      --cd: #ffffff;
      --tx: #2a1a1a;
      --mu: #7a6a60;
      --ln: #ece3cc;
      --gr: #0a8f63;
      --bl: #2563eb;
      --shadow-soft: 0 10px 25px -4px rgba(217, 31, 47, 0.07), 0 4px 10px -2px rgba(0, 0, 0, 0.04);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--tx);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      padding: 14px;
      max-width: 500px;
      margin-inline: auto;
      line-height: 1.45;
    }
    .hd {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--ln);
    }
    .logo-img {
      height: 44px;
      width: auto;
      object-fit: contain;
      flex-shrink: 0;
    }
    h1 { font-size: 16px; margin: 0; color: var(--rd); line-height: 1.2; font-weight: 800; }
    h1 small { display: block; font-size: 11px; color: var(--mu); font-weight: 600; margin-top: 2px; }

    .card {
      background: var(--cd);
      border: 1px solid var(--ln);
      border-radius: 16px;
      padding: 16px;
      box-shadow: var(--shadow-soft);
      margin-bottom: 14px;
    }
    input[type=search] {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--ln);
      border-radius: 12px;
      font-size: 14px;
      outline: none;
      background: #fff;
      font-family: inherit;
      color: var(--tx);
    }
    input[type=search]:focus { border-color: var(--rd); }

    .res {
      max-height: 250px;
      overflow-y: auto;
      margin-top: 8px;
    }
    .res-item {
      padding: 10px 8px;
      border-bottom: 1px solid var(--ln);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.15s;
    }
    .res-item:hover, .res-item:active { background: #fff5ea; }
    .res-item b { font-size: 13px; color: var(--tx); display: block; }
    .res-item small { font-size: 11px; color: var(--mu); }

    .details-card {
      display: none;
      background: #fff;
      border: 1.5px solid #f6dd8f;
      border-radius: 16px;
      padding: 16px;
      margin-top: 12px;
      animation: fadeIn 0.25s ease forwards;
    }
    .party-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--rd);
      margin-bottom: 10px;
      line-height: 1.3;
    }
    
    /* Store Photo Preview Container */
    .store-photo-card {
      margin: 10px 0 14px 0;
      border-radius: 12px;
      overflow: hidden;
      border: 1.5px solid #e2e8f0;
      background: #0f172a;
      display: none;
      position: relative;
    }
    .store-photo-card img {
      width: 100%;
      height: 190px;
      object-fit: cover;
      display: block;
    }
    .store-photo-badge {
      position: absolute;
      bottom: 8px;
      left: 8px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .info-row {
      display: flex;
      font-size: 13px;
      margin-bottom: 6px;
      line-height: 1.4;
    }
    .info-lbl {
      width: 115px;
      color: var(--mu);
      font-weight: 600;
      flex-shrink: 0;
    }
    .info-val {
      color: var(--tx);
      font-weight: 500;
      word-break: break-word;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 99px;
      font-weight: 700;
      margin-top: 2px;
    }
    .tag.gps { background: #e8fbf1; border: 1px solid #8fe0b8; color: #0a7a4d; }
    .tag.approx { background: #fdf3d8; border: 1px solid #f6dd8f; color: #8a6500; }

    .actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 9px;
      margin-top: 16px;
    }
    button {
      border: 0;
      border-radius: 12px;
      padding: 13px 8px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-family: inherit;
      touch-action: manipulation;
      transition: all 0.2s;
    }
    .btn-wa {
      background: #25d366;
      color: #fff;
      font-size: 14.5px;
      box-shadow: 0 4px 12px rgba(37,211,102,0.3);
    }
    .btn-porter {
      background: linear-gradient(135deg, #1062eb, #094bb9);
      color: #fff;
      font-size: 14.5px;
      box-shadow: 0 4px 12px rgba(16, 98, 235, 0.35);
    }
    .btn-map { background: var(--bl); color: #fff; }
    .btn-call-rep {
      background: #fff8eb;
      color: #b45309;
      border: 1.5px solid #f6dd8f;
      font-size: 13.5px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      background: rgba(25, 25, 25, 0.95);
      backdrop-filter: blur(4px);
      color: #fff;
      padding: 11px 20px;
      border-radius: 99px;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      max-width: 90%;
      box-shadow: 0 6px 20px rgba(0,0,0,0.25);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 999;
    }
    .toast.on {
      opacity: 1;
      transform: translateX(-50%) translateY(-5px);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>

  <style>
    /* ===== Opening animation: signal rings -> pin draws in -> arrow launches -> ping -> zoom into the target -> app ===== */
    #splash { position: fixed; inset: 0; z-index: 2147483000; overflow: hidden;
      background: linear-gradient(180deg, #2a2b33 0%, #1f2229 50%, #181a21 100%);
      --W: min(80vw, 460px); --lx: .5004; --ly: .5029; --S: 14;
      animation: spFade .35s ease-in 2.55s forwards, spHide 0s linear 3.05s forwards; }
    .sp-skip #splash { display: none; }
    @keyframes spFade { to { opacity: 0; } }
    @keyframes spHide { to { visibility: hidden; } }
    .sp-stage { position: absolute; left: 50%; top: 50%; width: var(--W); height: var(--W);
      transform-origin: calc(var(--lx) * 100%) calc(var(--ly) * 100%);
      transform: translate(-50%, -50%) scale(1);
      animation: spZoom .95s cubic-bezier(.55, 0, .85, .45) 1.9s forwards; }
    @keyframes spZoom {
      from { transform: translate(-50%, -50%) scale(1); }
      to   { transform: translate(calc(-50% - (var(--lx) - .5) * var(--W)), calc(-50% - (var(--ly) - .5) * var(--W))) scale(var(--S)); } }
    .sp-stage img, .sp-fly { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block;
      user-select: none; -webkit-user-drag: none; transform-origin: calc(var(--lx) * 100%) calc(var(--ly) * 100%); }
    .sp-rings { opacity: 0; animation: spRings .75s cubic-bezier(.2, .7, .2, 1) .1s forwards; }
    @keyframes spRings { from { opacity: 0; transform: scale(.72); } to { opacity: 1; transform: scale(1); } }
    .sp-pin { opacity: 0; clip-path: inset(100% 0 0 0); animation: spPin .7s cubic-bezier(.4, 0, .2, 1) .4s forwards; }
    @keyframes spPin { 0% { opacity: 1; clip-path: inset(100% 0 0 0); } 100% { opacity: 1; clip-path: inset(0 0 0 0); } }
    .sp-arrow { opacity: 0; animation: spArrow .55s cubic-bezier(.2, .9, .3, 1) .9s forwards; }
    @keyframes spArrow {
      0%   { opacity: 0; transform: translate(-14%, 14%) scale(.55); }
      55%  { opacity: 1; transform: translate(1.5%, -1.5%) scale(1.03); }
      100% { opacity: 1; transform: translate(0, 0) scale(1); } }
    .sp-streaks { opacity: 0; animation: spStreaks .35s ease-out 1.2s forwards; }
    @keyframes spStreaks { from { opacity: 0; transform: translate(-4%, 4%); } to { opacity: 1; transform: translate(0, 0); } }
    .sp-fly { animation: spFly .4s cubic-bezier(.6, 0, .9, .4) 1.65s forwards; }
    @keyframes spFly { from { opacity: 1; transform: translate(0, 0) scale(1); } to { opacity: 0; transform: translate(42%, -42%) scale(1.1); } }
    .sp-ping { opacity: 0; animation: spPing .8s ease-out 1.5s forwards; }
    @keyframes spPing { 0% { opacity: .55; transform: scale(1); } 100% { opacity: 0; transform: scale(1.4); } }
    @media (prefers-reduced-motion: reduce) { #splash { display: none; } }
  </style>

<!-- Satmola login gate: one ID + password for every page. Owner approval decides which pages a person can open. -->
<style id="saCss">
#saGate{position:fixed;inset:0;z-index:2147482000;background:rgba(5,15,32,.78);overflow:auto;-webkit-overflow-scrolling:touch;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1B2536;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px}

#saSheet{position:fixed;inset:0;z-index:2147481000;background:rgba(15,10,10,.6);display:flex;align-items:flex-end;justify-content:center;font-family:system-ui,-apple-system,sans-serif}

<div id="saGate" style="display:none"></div>
<script>
(function () {
  var APP = "location", NAME = "Location Sender", SWITCH = null;
  var API = "https://script.google.com/macros/s/AKfycbwfr0u2afdCCSPJQ61JgyLSTt4fk9SF9YjgXWTJDh2fNOZL2ITrIUbHT-YbNo2OrtuAcA/exec";
  var TOK = "satmola_token", USR = "satmola_user", OWN = "satmola_owner";
  var gate = document.getElementById("saGate"), passed = false, otpUser = "", lastMode = "", readyRes;
  var checking = false, offlineNow = false, noAccessNow = false, lastTouch = 0;
  var ready = new Promise(function (r) { readyRes = r; });

  function g(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function s(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
  function ownerKey() { try { return localStorage.getItem(OWN) || sessionStorage.getItem(OWN) || ""; } catch (e) { return ""; } }
  function clearOwner() { try { localStorage.removeItem(OWN); sessionStorage.removeItem(OWN); } catch (e) {} }
  function esc(x) { return String(x == null ? "" : x).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function dev() { var u = navigator.userAgent || ""; var os = /Android/i.test(u) ? "Android" : /iPhone|iPad/i.test(u) ? "iPhone" : /Windows/i.test(u) ? "Windows" : /Mac OS/i.test(u) ? "Mac" : "Other"; return os + (window.matchMedia && matchMedia("(display-mode: standalone)").matches ? " (installed app)" : " (browser)"); }
  function api(o) {
    o.device = dev();
    return fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(o) })
      .then(function (r) { return r.json(); })
      .catch(function () { return { ok: false, offline: true, error: "Could not reach the server. Check your internet and try again." }; });
  }
  function ping(k) {
    return fetch(API + "?action=ping&key=" + encodeURIComponent(k)).then(function (r) { return r.json(); })
      .then(function (j) { return !!(j && j.ok && j.role === "owner"); }).catch(function () { return null; });
  }
  function has(apps) { return (apps || []).indexOf(APP) > -1; }
  function $(id) { return document.getElementById(id); }

  /* Used by the page itself to read data with a person's login instead of the Owner Key */
  window.SatmolaAuth = {
    app: APP,
    ready: ready,   // resolves once the person is logged in, so the page waits before asking for data
    token: function () { return g(TOK) || ""; },
    param: function (key) {
      if (key && key !== "@user") { lastMode = "owner"; return "key=" + encodeURIComponent(key); }
      lastMode = "user"; return "token=" + encodeURIComponent(g(TOK) || "");
    },
    deniedMsg: function () { return lastMode === "user" ? "Your login cannot read this data. Please log in again or ask the owner." : "Wrong owner key - refresh and enter it again"; },
    logout: function () { s(TOK, null); s(USR, null); location.reload(); }
  };

  /* ---------- screens ---------- */
  function card(inner) {
    gate.innerHTML = '<div class="sa-box"><div class="sa-brand">SATMOLA</div><div class="sa-app">' + esc(NAME) + '</div><div class="sa-card"><button class="sa-x" id="saX0" aria-label="Close">&times;</button>' + inner + '</div></div>';
    gate.style.display = "flex";
    $("saX0").onclick = hide;
    gate.scrollTop = 0;
    var go = gate.querySelectorAll("[data-go]");
    for (var i = 0; i < go.length; i++) go[i].onclick = function () { SCREENS[this.getAttribute("data-go")](); };
    var inputs = gate.querySelectorAll("input");
    for (var j = 0; j < inputs.length; j++) inputs[j].onkeydown = function (e) { if (e.key === "Enter") { var b = gate.querySelector(".sa-btn"); if (b) b.click(); } };
  }
  function say(t, good) { var e = $("saM"); if (e) { e.textContent = t || ""; e.className = "sa-msg" + (good ? " ok" : ""); } }
  function hide() { gate.style.display = "none"; }
  function visible() { return gate.style.display !== "none"; }
  function lock() { passed = false; var a = $("saOut"); if (a) a.parentNode.removeChild(a); var b = $("saSw"); if (b) b.parentNode.removeChild(b); }

  var SCREENS = {
    login: function (note, good) {
      card('<h2>Login</h2><p class="sa-sub">Use the ID and password you registered with.</p>' +
        '<label for="saU">Login ID</label><input id="saU" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">' +
        '<label for="saP">Password</label><input id="saP" type="password" autocomplete="current-password">' +
        '<button class="sa-btn" id="saGo">Login</button><div class="sa-msg" id="saM" aria-live="polite"></div>' +
        '<div class="sa-links"><a data-go="forgot">Forgot password?</a><a data-go="reg">Create account</a></div>' +
        '<div class="sa-links" style="justify-content:center"><a data-go="admin">Admin login</a></div>');
      if (note) say(note, good);
      $("saGo").onclick = function () {
        var u = $("saU").value.trim().toLowerCase(), p = $("saP").value;
        if (!u || !p) return say("Enter your login ID and password.");
        var b = $("saGo"); b.disabled = true; say("Checking...", true);
        api({ act: "login", username: u, pass: p }).then(function (r) {
          b.disabled = false;
          if (r.ok && r.user) { s(TOK, r.token); s(USR, JSON.stringify(r.user)); clearOwner(); if (has(r.user.apps)) pass("user"); else SCREENS.noaccess(); }
          else say(r.error || "Could not sign in. Try again.");
        });
      };
    },
    reg: function () {
      card('<button class="sa-back" data-go="login">&lsaquo; Back</button><h2>Register</h2><p class="sa-sub">We email you a code to check your email. Then the owner approves your account.</p>' +
        '<label for="rN">Full name</label><input id="rN" autocomplete="name">' +
        '<label for="rM">Mobile number</label><input id="rM" inputmode="numeric" maxlength="10" autocomplete="tel">' +
        '<label for="rE">Email</label><input id="rE" type="email" autocomplete="email" autocapitalize="none">' +
        '<label for="rI">Login ID (like admin01 or admin@1)</label><input id="rI" autocapitalize="none" autocorrect="off" spellcheck="false">' +
        '<label for="rP">Password (6+ characters)</label><input id="rP" type="password" autocomplete="new-password">' +
        '<label for="rQ">Confirm password</label><input id="rQ" type="password" autocomplete="new-password">' +
        '<button class="sa-btn" id="saGo">Send code to my email</button><div class="sa-msg" id="saM" aria-live="polite"></div>');
      $("saGo").onclick = function () {
        var name = $("rN").value.trim(), mob = $("rM").value.trim(), em = $("rE").value.trim().toLowerCase(), un = $("rI").value.trim().toLowerCase(), p1 = $("rP").value, p2 = $("rQ").value, err = "";
        if (name.length < 2) err = "Enter your full name.";
        else if (!/^[6-9]\d{9}$/.test(mob)) err = "Enter a valid 10-digit mobile number.";
        else if (!/^[^\s@,;<>]+@[^\s@,;<>]+\.[^\s@,;<>]{2,}$/.test(em)) err = "Enter a valid email address.";
        else if (!/^[a-z0-9][a-z0-9_.@-]{3,19}$/.test(un)) err = "Login ID must be 4 to 20 characters: letters, numbers and _ . @ - (for example admin01 or admin@1).";
        else if (p1.length < 6) err = "Password must be at least 6 characters.";
        else if (p1 !== p2) err = "The two passwords do not match.";
        if (err) return say(err);
        var b = $("saGo"); b.disabled = true; say("Sending the code...", true);
        api({ act: "register", name: name, username: un, mobile: mob, email: em, pass: p1 }).then(function (r) {
          b.disabled = false;
          if (r.ok && r.otp) { otpUser = un; SCREENS.otp(r.email || em); }
          else if (r.ok) say(r.message || "Registered. You can log in after the owner approves your account.", true);
          else say(r.error || "Could not register. Try again.");
        });
      };
    },
    otp: function (email) {
      card('<button class="sa-back" data-go="reg">&lsaquo; Back</button><h2>Check your email</h2><p class="sa-sub">We sent a 6-digit code to ' + esc(email || "your email") + '.</p>' +
        '<label for="oC">6-digit code</label><input id="oC" inputmode="numeric" maxlength="6" autocomplete="one-time-code">' +
        '<button class="sa-btn" id="saGo">Verify</button><div class="sa-msg" id="saM" aria-live="polite"></div>' +
        '<div class="sa-links"><a id="saRe">Send the code again</a></div>');
      $("saGo").onclick = function () {
        var code = $("oC").value.replace(/\D/g, "");
        if (code.length !== 6) return say("Enter the 6-digit code from your email.");
        var b = $("saGo"); b.disabled = true;
        api({ act: "verify_email", username: otpUser, otp: code }).then(function (r) {
          b.disabled = false;
          if (r.ok) { otpUser = ""; SCREENS.login("Email verified. You can log in after the owner approves your account.", true); }
          else if (r.expired) { otpUser = ""; SCREENS.reg(); say(r.error || "Please register again."); }
          else say(r.error || "Could not verify. Try again.");
        });
      };
      $("saRe").onclick = function () {
        api({ act: "resend_otp", username: otpUser }).then(function (r) {
          if (r.expired) { otpUser = ""; SCREENS.reg(); say(r.error || "Please register again."); }
          else say(r.error || r.message || "Code sent again.", !!r.ok);
        });
      };
    },
    forgot: function () {
      card('<button class="sa-back" data-go="login">&lsaquo; Back</button><h2>Forgot password</h2><p class="sa-sub">The owner will be told and will give you a new password.</p>' +
        '<label for="fI">Login ID</label><input id="fI" autocapitalize="none" autocorrect="off" spellcheck="false">' +
        '<button class="sa-btn" id="saGo">Tell the owner</button><div class="sa-msg" id="saM" aria-live="polite"></div>');
      $("saGo").onclick = function () {
        var u = $("fI").value.trim().toLowerCase(); if (!u) return say("Enter your login ID.");
        api({ act: "forgot", username: u }).then(function (r) { say(r.ok ? (r.message || "The owner has been told.") : (r.error || "Could not send the request."), !!r.ok); });
      };
    },
    admin: function () {
      card('<button class="sa-back" data-go="login">&lsaquo; Back</button><h2>Admin login</h2><p class="sa-sub">Enter the Owner Key to open every page.</p>' +
        '<label for="aK">Owner Key</label><input id="aK" type="password" autocomplete="off" autocapitalize="none">' +
        '<button class="sa-btn" id="saGo">Open</button><div class="sa-msg" id="saM" aria-live="polite"></div>');
      $("saGo").onclick = function () {
        var k = $("aK").value.trim(); if (!k) return say("Enter the Owner Key.");
        var b = $("saGo"); b.disabled = true; say("Checking key...", true);
        api({ act: "admin_login", key: k }).then(function (r) {
          b.disabled = false;
          if (r.ok) { try { localStorage.setItem(OWN, k); } catch (e) {} s(TOK, null); s(USR, null); pass("owner"); }
          else say(r.error || "Wrong Owner Key.");
        });
      };
    },
    noaccess: function () {
      card('<h2>No access</h2><p class="sa-sub">Your account is not approved for ' + esc(NAME) + ' yet. Ask the owner to give you access, then open this page again.</p>' +
        '<button class="sa-btn" id="saGo">Check again</button><button class="sa-btn alt" id="saLo">Log out</button><div class="sa-msg" id="saM"></div>');
      $("saGo").onclick = function () { say("Checking...", true); check(false); };
      $("saLo").onclick = function () { s(TOK, null); s(USR, null); noAccessNow = false; SCREENS.login(); };
    },
    wait: function () {
      card('<h2>Checking login...</h2><p class="sa-sub">Please wait a moment.</p>');
    },
    offline: function () {
      card('<h2>No internet</h2><p class="sa-sub">Could not check your login. Please check your internet and try again.</p><button class="sa-btn" id="saGo">Try again</button>');
      $("saGo").onclick = function () { offlineNow = false; start(); if (checking) SCREENS.wait(); };
    }
  };

  /* ---------- pass / switcher ---------- */
  function pass(role) {
    passed = true; noAccessNow = false; hide(); readyRes();
    if (role === "owner") { if (SWITCH) addSwitcher(); }
    else if (!$("saOut")) {
      var b = document.createElement("button"); b.id = "saOut"; b.textContent = "Log out";
      b.onclick = function () { window.SatmolaAuth.logout(); };
      document.body.appendChild(b);
    }
  }
  function addSwitcher() {
    if ($("saSw")) return;
    var b = document.createElement("button"); b.id = "saSw"; b.textContent = "⇄ Pages";
    b.onclick = function () {
      var o = document.createElement("div"); o.id = "saSheet";
      var h = '<div class="sa-in"><h3>Open a page</h3>';
      for (var i = 0; i < SWITCH.length; i++) h += '<a href="' + esc(SWITCH[i][1]) + '"' + (SWITCH[i][2] ? ' class="here"' : "") + ">" + esc(SWITCH[i][0]) + "</a>";
      o.innerHTML = h + '<button id="saX">Close</button></div>';
      document.body.appendChild(o);
      o.onclick = function (e) { if (e.target === o || e.target.id === "saX") o.parentNode.removeChild(o); };
    };
    document.body.appendChild(b);
  }

  /* ---------- check on every open (silent: the page itself stays open) ---------- */
  function check(silent) {
    checking = true;
    api({ act: "me", token: g(TOK) || "" }).then(function (r) {
      checking = false;
      if (r.offline) { offlineNow = !passed; if (visible() && !silent) SCREENS.offline(); return; }
      offlineNow = false;
      if (r.ok && r.user) {
        s(USR, JSON.stringify(r.user));
        if (has(r.user.apps)) { pass("user"); }
        else { lock(); noAccessNow = true; if (visible()) SCREENS.noaccess(); }
        return;
      }
      s(TOK, null); s(USR, null); lock();
      if (visible()) SCREENS.login("Your session ended. Please log in again.");
    });
  }
  function start() {
    var ok = ownerKey(), tok = g(TOK), cached = null;
    try { cached = JSON.parse(g(USR) || "null"); } catch (e) { cached = null; }
    if (ok) {
      pass("owner");
      ping(ok).then(function (v) { if (v === false) { clearOwner(); lock(); if (visible()) SCREENS.login("Owner Key is no longer valid. Please log in again."); } });
      return;
    }
    if (tok && cached && has(cached.apps)) { pass("user"); check(true); return; }
    if (tok) { check(false); }
  }

  /* ---------- ask for login only when the person tries to do something ---------- */
  function askLogin() {
    if (checking) SCREENS.wait();
    else if (offlineNow) SCREENS.offline();
    else if (noAccessNow) SCREENS.noaccess();
    else SCREENS.login();
  }
  function skip(t) { return !!(t.closest && t.closest("#saGate,#saSheet,#saOut,#saSw,#splash")); }
  var SEL = "button,a,input,select,textarea,label,summary,[onclick],[role=button],[role=tab]";
  function interactive(t) {
    for (var el = t, i = 0; el && el.nodeType === 1 && i < 7; el = el.parentElement, i++) {
      if (el.matches && el.matches(SEL)) return true;
      try { if (getComputedStyle(el).cursor === "pointer") return true; } catch (e) {}
    }
    return false;
  }
  function block(e) {
    if (passed) return;
    var t = e.target;
    if (!t || t.nodeType !== 1 || skip(t) || !interactive(t)) return;
    if (e.type === "click" && !e.isTrusted) return;                       // the page's own code can still click things
    if (e.type === "focusin" && Date.now() - lastTouch > 800) return;    // ignore focus the page sets by itself
    e.preventDefault(); e.stopPropagation(); if (e.stopImmediatePropagation) e.stopImmediatePropagation();
    if (e.type === "focusin" && t.blur) t.blur();
    askLogin();
  }
  function touched() { lastTouch = Date.now(); }
  document.addEventListener("pointerdown", touched, true);
  document.addEventListener("touchstart", touched, true);
  document.addEventListener("keydown", touched, true);
  document.addEventListener("click", block, true);
  document.addEventListener("focusin", block, true);
  start();
})();

function saveOwnerKey(k, remember) { try { localStorage.removeItem(OWNER_LS); sessionStorage.removeItem(OWNER_LS); (remember ? localStorage : sessionStorage).setItem(OWNER_LS, k); } catch (e) {} }
function forgetOwnerKey() { try { localStorage.removeItem(OWNER_LS); sessionStorage.removeItem(OWNER_LS); } catch (e) {} }
function pingOwner(k) {
  return fetch(SCRIPT_URL + "?action=ping&key=" + encodeURIComponent(k)).then(function(r) { return r.json(); })
    .then(function(j) { return !!(j && j.ok && j.role === "owner"); }).catch(function() { return null; });
}
function ownerPopup(msg, isErr) {
  return new Promise(function(resolve) {
    var ov = document.createElement("div");
    ov.style.cssText = "position:fixed;inset:0;background:rgba(15,10,10,.78);z-index:99999;display:flex;align-items:center;justify-content:center;padding:18px;font-family:system-ui,-apple-system,sans-serif";
    ov.innerHTML = '<div style="background:#fff;border-radius:16px;max-width:340px;width:100%;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.4)">' +
      '<div style="font-size:18px;font-weight:800;color:#b8101f;margin-bottom:6px">🔒 Owner Login</div>' +
      '<div id="opMsg" style="font-size:13px;margin-bottom:12px;color:' + (isErr ? "#b91c1c" : "#6b5b50") + '"></div>' +
      '<input id="opKey" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Owner code" style="width:100%;box-sizing:border-box;padding:13px 14px;border:1.5px solid #d6c9b8;border-radius:12px;font-size:16px;outline:none">' +
      '<label style="display:flex;gap:8px;align-items:center;margin:12px 0 14px;font-size:13px;color:#3b2f2f"><input id="opRem" type="checkbox" checked> Remember on this device</label>' +
      '<div style="display:flex;gap:10px"><button id="opGo" style="flex:1;padding:13px;border:0;border-radius:12px;background:#d91f2f;color:#fff;font-weight:800;font-size:15px">Open</button>' +
      '<button id="opNo" style="padding:13px 16px;border:1.5px solid #d6c9b8;border-radius:12px;background:#fff;color:#6b5b50;font-weight:700">Cancel</button></div></div>';
    document.body.appendChild(ov);
    ov.querySelector("#opMsg").textContent = msg;
    var inp = ov.querySelector("#opKey");
    setTimeout(function() { inp.focus(); }, 50);
    function done(v) { document.body.removeChild(ov); resolve(v); }
    ov.querySelector("#opGo").onclick = function() { done({ key: inp.value.trim(), remember: ov.querySelector("#opRem").checked }); };
    ov.querySelector("#opNo").onclick = function() { done(null); };
    inp.onkeydown = function(e) { if (e.key === "Enter") ov.querySelector("#opGo").click(); };
  });
}
function addLogoutBtn() {
  if (document.getElementById("opLogout")) return;
  var b = document.createElement("button");
  b.id = "opLogout"; b.textContent = "🔒 Logout";
  b.style.cssText = "position:fixed;left:8px;bottom:8px;z-index:9999;padding:6px 10px;border:1px solid #d6c9b8;border-radius:10px;background:#fff;color:#6b5b50;font-size:11px;font-weight:700;opacity:.85";
  b.onclick = function() { forgetOwnerKey(); location.reload(); };
  document.body.appendChild(b);
}
var _ownP = null;
function ensureOwner() {
  if (!_ownP) _ownP = _ensureOwner().then(function(v) { _ownP = null; return v; }, function(e) { _ownP = null; throw e; });
  return _ownP;
}
async function _ensureOwner() {
  if (window.SatmolaAuth) await SatmolaAuth.ready;  // wait until the login gate is passed
  var k = getOwnerKey();
  if (!k && window.SatmolaAuth && SatmolaAuth.token()) return "@user";  // logged-in person: use the login token
  if (k) {
    var ok0 = await pingOwner(k);
    if (ok0 !== false) { addLogoutBtn(); return k; }   // code is valid, or no internet (the saved code is kept)
    forgetOwnerKey();
  }
  var msg = "This page is for the owner only. Enter your Owner Code.", err = false;
  for (var i = 0; i < 5; i++) {
    var r = await ownerPopup(msg, err);
    if (!r || !r.key) return "";
    var ok = await pingOwner(r.key);
    if (ok) { saveOwnerKey(r.key, r.remember); addLogoutBtn(); return r.key; }
    err = true;
    msg = ok === null ? "No internet connection. Please check and try again." : "Wrong code. Please try again.";
  }
  return "";
}
    var BPS = [];
    var SHEET_REP = {};   // built from the sheet's 'S.e Mobile' column: sales rep -> number
    function ph10(v){var d=String(v||'').replace(/\D/g,'');if(d.length>10)d=d.slice(-10);return d.length===10?d:''}
    function S(v){return String(v==null?"":v).trim()}
    var curBp = null;
    var $ = function(id) { return document.getElementById(id); };

    function toast(m, duration) {
      var t = $("toast"); 
      t.textContent = m; 
      t.className = "toast on";
      setTimeout(function(){ t.className = "toast"; }, duration || 2400);
    }

    // Photos are private: fetched through the script with the owner code (no public link needed)
    var _photoTok = 0;
    function showPrivatePhoto(link) {
      var img = $("dPhotoImg"), tok = ++_photoTok;
      img.removeAttribute("src");
      if (!link) return;
      fetch(SCRIPT_URL + "?action=photo&url=" + encodeURIComponent(link) + "&" + SatmolaAuth.param(getOwnerKey() || "@user"))
        .then(function(r) { return r.json(); })
        .then(function(j) {
          if (tok !== _photoTok) return;
          if (j && j.data) img.src = j.data;
          else img.src = getDirectPhotoUrl(link);   // if it is an old public photo, show it directly
        })
        .catch(function() { if (tok === _photoTok) img.src = getDirectPhotoUrl(link); });
    }

    // Helper to extract Drive direct image preview link
    function getDirectPhotoUrl(link) {
      if (!link) return "";
      var m = link.match(/id=([a-zA-Z0-9_-]+)/) || link.match(/\/d\/([a-zA-Z0-9_-]+)/);
      if (m && m[1]) {
        return "https://drive.google.com/thumbnail?id=" + m[1] + "&sz=w800";
      }
      return link;
    }

    // Helper to parse coordinate links
    function parseCoordsFromUrl(url) {
      if (!url) return null;
      var m = url.match(/q=(-?\d+\.\d+),(-?\d+\.\d+)/) ||
              url.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/) ||
              url.match(/(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)/);
      return m ? [parseFloat(m[1]), parseFloat(m[2])] : null;
    }

    // Live Sync from Master Sheet
    function fetchLiveBps() {
      toast("Syncing live BP Master...", 2000);
      ensureOwner()
        .then(function(key) { if (!key) { toast("Owner key required - refresh the page and enter it"); return Promise.reject("nokey"); } return fetch(SCRIPT_URL + "?" + SatmolaAuth.param(key)); })
        .then(function(res) { return res.json(); })
        .then(function(data) {
          if (data && data.denied) { try { localStorage.removeItem("satmola_owner"); } catch (e) {} toast(SatmolaAuth.deniedMsg()); return; }
          if (!Array.isArray(data) || data.length === 0) { toast("Sheet sync failed: " + (data && data.error ? data.error : "no data")); return; }
          BPS = data.map(function(r) {
            // Pin selection rule: Final (verified with Google Maps) -> Driver -> Sales -> old column names
            var lat = "", lng = "";
            var sets = [["Final Lat","Final Lng"],["Driver Lat","Driver Lng"],["Sales Lat","Sales Lng"],["Latitude","Longitude"],["Lat","Lng"]];
            for (var i = 0; i < sets.length; i++) {
              var a = parseFloat(r[sets[i][0]]), b = parseFloat(r[sets[i][1]]);
              if (isFinite(a) && isFinite(b) && a > 6 && a < 38 && b > 67 && b < 98) { lat = a.toFixed(6); lng = b.toFixed(6); break; }
            }
            var link = S(r["Final Map Link"] || r["Driver Map Link"] || r["Sales Map Link"] || r["Map Hyperlink"]);
            if (!lat || !lng) {
              var links = [r["Final Map Link"], r["Driver Map Link"], r["Sales Map Link"], r["Map Hyperlink"]];
              for (var j = 0; j < links.length; j++) {
                var p = parseCoordsFromUrl(S(links[j]));
                if (p && p[0] > 6 && p[0] < 38 && p[1] > 67 && p[1] < 98) { lat = p[0].toFixed(6); lng = p[1].toFixed(6); break; }
              }
            }
            var photo = S(r["Photo Link"] || r["Sales Photo Link"] || r["Driver Photo Link"] || r["photo link (Sales Team)"]);
            var hasPin = !!(lat && lng);
            var repName = r["Sales Employee"] || "";
            var repMob = ph10(r["S.e Mobile"]);
            if (repName && repMob && !SHEET_REP[repName]) SHEET_REP[repName] = repMob;

            return [
              r["BP Name"] || "",
              r["City Name"] || r["Ship-to City"] || "",
              r["Bill-to Block"] || "",
              r["Sales Employee"] || "",
              r["GRoup"] || "",
              r["State"] || "",
              lat,
              lng,
              link,
              photo,
              hasPin ? S(r["Location Confidence"]) : "",
              hasPin ? S(r["Location Status"]) : "",
              repMob
            ];
          }).filter(function(b) { return b[0]; });
          toast("● " + BPS.length + " Parties Loaded Live", 2200);
        }).catch(function(err) {
          if (err === "nokey") return; console.error("Live fetch error:", err); toast("Sheet sync error - check internet / script URL");
        });
    }
    window.addEventListener("DOMContentLoaded", fetchLiveBps);

    // Reliable Google Maps Link Resolution
    function getMapUrl(bp) {
      if (!bp) return "";
      if (bp.hasGps) {
        return "https://www.google.com/maps?q=" + bp.lat + "," + bp.lng;
      }
      if (bp.mapLink && bp.mapLink.indexOf("http") > -1) {
        return bp.mapLink;
      }
      return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(bp.name + " " + bp.block + " " + bp.city);
    }

    // Search Query Matching
    $("q").oninput = function() {
      var q = this.value.trim().toLowerCase();
      var res = $("res");
      if (!q) { res.innerHTML = ""; return; }

      var matches = [];
      for (var i = 0; i < BPS.length; i++) {
        var b = BPS[i];
        var text = (b[0] + " " + b[1] + " " + b[2] + " " + b[3] + " " + b[4]).toLowerCase();
        if (text.indexOf(q) > -1) matches.push({ idx: i, data: b });
        if (matches.length >= 8) break;
      }

      res.innerHTML = matches.map(function(m) {
        return "<div class='res-item' data-idx='" + m.idx + "'>" +
               "<div><b>" + m.data[0] + "</b><small>" + m.data[1] + " · " + m.data[2] + "</small></div>" +
               "<span style='color:var(--rd);font-weight:700;'>Select ➔</span>" +
               "</div>";
      }).join("") || "<div style='padding:10px;color:var(--mu);font-size:12px;'>No matching parties found</div>";
    };

    // Render Selected BP Details
    $("res").onclick = function(e) {
      var item = e.target.closest("[data-idx]");
      if (!item) return;
      var b = BPS[+item.dataset.idx];
      var rep = b[3] || "N/A";
      var repPhone = REP_PHONES[rep] || SHEET_REP[rep] || b[12] || "";
      var hasGps = !!(b[6] && b[7]);
      var photoUrl = b[9] || "";

      curBp = {
        name: b[0],
        city: b[1],
        block: b[2],
        rep: rep,
        group: b[4] || "N/A",
        repPhone: repPhone,
        lat: b[6],
        lng: b[7],
        mapLink: b[8] || "",
        hasGps: hasGps,
        photoUrl: photoUrl,
        conf: b[10] || "",
        ls: b[11] || ""
      };

      $("q").value = curBp.name;
      $("res").innerHTML = "";

      $("dName").textContent = curBp.name;
      $("dGroup").textContent = curBp.group;
      $("dRep").textContent = curBp.rep + (curBp.repPhone ? " (" + curBp.repPhone + ")" : "");
      $("dCity").textContent = curBp.city;
      $("dBlock").textContent = curBp.block;
      $("repNameShort").textContent = curBp.rep;
      
      // Storefront Photo Preview
      if (curBp.photoUrl) {
        showPrivatePhoto(curBp.photoUrl);
        $("dPhotoCard").style.display = "block";
      } else {
        $("dPhotoCard").style.display = "none";
      }

      if (curBp.hasGps) {
        var coords = " (" + curBp.lat + ", " + curBp.lng + ")";
        var why = curBp.ls ? " - " + curBp.ls : "";
        if (curBp.conf === "High") {
          $("dLocTag").innerHTML = "<span class='tag gps'><i class='fa-solid fa-circle-check'></i> Verified Pin" + why + coords + "</span>";
        } else if (curBp.conf === "Low") {
          $("dLocTag").innerHTML = "<span class='tag approx'><i class='fa-solid fa-triangle-exclamation'></i> Check pin" + why + coords + "</span>";
        } else {
          $("dLocTag").innerHTML = "<span class='tag approx'><i class='fa-solid fa-circle-dot'></i> Pin (single source)" + why + coords + "</span>";
        }
      } else {
        $("dLocTag").innerHTML = "<span class='tag approx'><i class='fa-solid fa-circle-dot'></i> Approximate Area Pin</span>";
      }

      $("detCard").style.display = "block";
    };

    // Register service worker so Chrome offers "Install app" (works on phone and PC)
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }

    // Porter: copy the drop pin, then open the Porter app itself.
    // Porter has no public link that accepts coordinates, so the pin is copied and pasted into Porter's drop box.
    function copyText(t) {
      try { if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(t).then(function() { return true; }, function() { return false; }); } catch (e) {}
      try { var ta = document.createElement("textarea"); ta.value = t; ta.style.cssText = "position:fixed;opacity:0"; document.body.appendChild(ta); ta.select(); var ok = document.execCommand("copy"); document.body.removeChild(ta); return Promise.resolve(ok); } catch (e2) { return Promise.resolve(false); }
    }
    $("btnPorter").onclick = function() {
      if (!curBp) return toast("Please select a Business Partner first!");
      var isAndroid = /android/i.test(navigator.userAgent);
      var label = String(curBp.name || "Store").replace(/[()\[\]{}<>&#?%+=\/\\;:"']/g, " ").replace(/\s+/g, " ").trim().slice(0, 60);
      var hasPin = !!curBp.hasGps;
      var q = hasPin ? (curBp.lat + "," + curBp.lng) : [curBp.name, curBp.block, curBp.city].filter(Boolean).join(", ");
      var webMap = "https://www.google.com/maps?q=" + encodeURIComponent(q);
      copyText(q);   // quiet backup copy, no message
      if (!isAndroid) { window.open(webMap, "_blank"); return; }
      // Same as tapping a map link in WhatsApp: Android shows its own "Open with" list (Porter, Maps, Rapido...) for the exact pin.
      var geo = hasPin ? ("0,0?q=" + q + "(" + encodeURIComponent(label) + ")") : ("0,0?q=" + encodeURIComponent(q));
      window.location.href = "intent:" + geo + "#Intent;scheme=geo;action=android.intent.action.VIEW;S.browser_fallback_url=" + encodeURIComponent(webMap) + ";end";
    };

    // Share Details on WhatsApp (Clean text, Photo NOT shared, only Google Maps pin)
    $("btnWa").onclick = function() {
      if (!curBp) return;
      var mapLink = getMapUrl(curBp);
      var repDetails = curBp.rep + (curBp.repPhone ? " (" + curBp.repPhone + ")" : "");

      var text = "👨‍💻 *SATMOLA PARTY DETAILS*\n" +
                 "━━━━━━━━━━━━━━━━━━\n" +
                 "🏬 *Party:* " + curBp.name + "\n" +
                 "🏷️ *Group:* " + curBp.group + "\n" +
                 "👤 *Rep:* " + repDetails + "\n" +
                 "📍 *Address:* " + curBp.block + ", " + curBp.city + "\n" +
                 "🗺️ *Location Pin:* " + mapLink;

      window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank");
    };

    // Call Sales Representative
    $("btnCallRep").onclick = function() {
      if (!curBp) return;
      if (!curBp.repPhone) {
        return toast("Contact number for " + curBp.rep + " is not configured.");
      }
      window.location.href = "tel:" + curBp.repPhone.trim();
    };

    // Open Google Map Pin
    $("btnMap").onclick = function() {
      if (!curBp) return;
      var mapLink = getMapUrl(curBp);
      window.open(mapLink, "_blank");
    };
  </script>
</body>
</html>
